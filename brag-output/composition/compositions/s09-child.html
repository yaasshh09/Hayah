      <script>
        (function () {
          const tl = gsap.timeline({ paused: true });
          const fmt = (n) => Math.round(n).toLocaleString("en-US");
          const count = (sel, to, pre, suf, t, d) => {
            const o = { v: 0 };
            const el = document.querySelector(sel);
            tl.fromTo(o, { v: 0 }, { v: to, duration: d, ease: "power3.out", onUpdate: () => (el.textContent = pre + fmt(o.v) + suf) }, t);

          // Phase 1: the Adult / Child switch
          tl.fromTo("#s09-head", { opacity: 0, x: -40 }, { opacity: 1, x: 0, duration: 0.4, ease: "power3.out" }, 0.15);

          tl.fromTo("#s09-tgcap", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.45, ease: "power2.out" }, 0.6);
          tl.fromTo("#s09-cur", { opacity: 0, x: 1600, y: 900 }, { opacity: 1, x: 1190, y: 470, duration: 0.8, ease: "power3.inOut" }, 2.2);
          tl.to("#s09-tg", { scale: 1.03, duration: 1.0, ease: "power1.in" }, 2.95);
          // beat-locked: 95.85s global, the switch flips on the drop
          tl.to("#s09-cur", { scale: 0.7, duration: 0.07, yoyo: true, repeat: 1 }, 3.9);
          tl.to("#s09-knob", { x: 440, backgroundColor: "#9f8fe0", duration: 0.32, ease: "back.out(1.6)" }, 3.97);
          tl.to("#s09-la", { color: "#b9b6c2", duration: 0.2 }, 3.97);
          tl.to("#s09-lc", { color: "#ffffff", duration: 0.2 }, 3.97);
          tl.to("#s09-tg", { scale: 1, duration: 0.25, ease: "back.out(3)" }, 3.97);
          tl.fromTo("#s09-wash", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.out" }, 3.97);

          // Phase 2: Latifa's real dashboard
          tl.to("#s09-ph1", { y: -700, opacity: 0, duration: 0.5, ease: "power3.in" }, 4.3);
          tl.to("#s09-cur", { opacity: 0, duration: 0.2 }, 4.3);
          tl.fromTo("#s09-bw", { x: 860, y: 1100, scale: 0.52, rotation: -4, opacity: 1 }, { y: 250, rotation: 0, duration: 0.8, ease: "power3.out" }, 4.45);
          tl.to("#s09-bw", { scale: 0.55, duration: 3.4, ease: "none" }, 5.25);
          tl.fromTo("#s09-ph2 .w", { opacity: 0, y: 70 }, { opacity: 1, y: 0, duration: 0.45, ease: "power3.out", stagger: 0.07 }, 4.6);
          tl.fromTo("#s09-p2", { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.45, ease: "power2.out" }, 5.7);

          // Phase 3: the jars
          tl.to("#s09-ph2", { x: -900, opacity: 0, duration: 0.5, ease: "power3.in" }, 8.3);
          tl.to("#s09-bw", { x: 1900, opacity: 0, rotation: 6, duration: 0.5, ease: "power3.in" }, 8.3);
          tl.fromTo("#s09-ph3 h2 .w", { opacity: 0, y: 80, scale: 0.8 }, { opacity: 1, y: 0, scale: 1, duration: 0.45, ease: "back.out(2)", stagger: 0.18 }, 8.55);
          const jars = [
            [160, 0.64],
            [66, 0.34],
            [19, 0.14],
          ];
          jars.forEach(([amt, lvl], i) => {
            tl.fromTo("#s09-j" + i, { opacity: 0, y: 200 }, { opacity: 1, y: 0, duration: 0.55, ease: "back.out(1.5)" }, 8.8 + i * 0.2);
            const t = 9.6 + i * 0.5;
            tl.fromTo("#s09-k" + i, { opacity: 1, y: 0 }, { y: 330 - lvl * 300, duration: 0.35, ease: "power2.in", immediateRender: false }, t);
            tl.to("#s09-k" + i, { opacity: 0, duration: 0.1 }, t + 0.35);
            tl.fromTo("#s09-q" + i, { scaleY: 0 }, { scaleY: lvl, duration: 0.9, ease: "elastic.out(1, 0.6)" }, t + 0.25);
            count("#s09-m" + i, amt, "AED ", "", t + 0.2, 0.8);
          });
          tl.fromTo("#s09-ring", { opacity: 0, scale: 0.7, rotation: -40 }, { opacity: 1, scale: 1, rotation: 0, duration: 0.6, ease: "back.out(1.6)" }, 10.9);
          tl.fromTo("#s09-arc", { strokeDashoffset: 1257 }, { strokeDashoffset: 1257 * 0.36, duration: 1.3, ease: "power3.out" }, 11.1);
          count("#s09-pc", 64, "", "%", 11.1, 1.3);
          tl.fromTo("#s09-goal", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.45, ease: "power2.out" }, 11.6);

          tl.to("#s09-j1", { rotation: -2, duration: 0.8, ease: "sine.inOut", yoyo: true, repeat: 3 }, 12.4);
