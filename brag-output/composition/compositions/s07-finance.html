      <script>
        (function () {
          const tl = gsap.timeline({ paused: true });
          const S = 0.78;
          const L = 211;
          const T = 110;
          const tabX = [163, 265, 362, 441, 535, 633];
          const tabY = T + (72 + 109) * S;
          const caps = ["#s07-c0", "#s07-c1", "#s07-c2", "#s07-c3", "#s07-c4", "#s07-c5", "#s07-c6"];
          const showCap = (i, t) => {
            if (i > 0) tl.to(caps[i - 1], { opacity: 0, y: -30, duration: 0.2, ease: "power2.in" }, t - 0.05);
            tl.fromTo(caps[i], { opacity: 0, y: 40, xPercent: -50 }, { opacity: 1, y: 0, xPercent: -50, duration: 0.35, ease: "back.out(1.8)" }, t + 0.1);
          };

          // Phase 1: the real finance page
          tl.fromTo("#s07-bw", { x: L, y: T + 160, scale: 0.7, opacity: 0, filter: "blur(10px)" }, { y: T, scale: S, opacity: 1, filter: "blur(0px)", duration: 0.7, ease: "power3.out" }, 0.1);
          tl.fromTo("#s07-head", { opacity: 0, x: -40 }, { opacity: 1, x: 0, duration: 0.4, ease: "power3.out" }, 0.3);
          showCap(0, 0.9);

          // Hayati insight card comes forward, cursor presses Get AI advice
          tl.to("#s07-bw", { filter: "blur(5px) brightness(0.92)", duration: 0.4 }, 2.35);
          tl.fromTo("#s07-ins", { opacity: 0, y: 260, scale: 0.9 }, { opacity: 1, y: 0, scale: 1, duration: 0.55, ease: "power3.out" }, 2.35);
          tl.fromTo("#s07-l1", { opacity: 0, x: -40 }, { opacity: 1, x: 0, duration: 0.4, ease: "power2.out" }, 2.8);
          tl.fromTo("#s07-l2", { opacity: 0, x: -40 }, { opacity: 1, x: 0, duration: 0.4, ease: "power2.out" }, 3.6);
          tl.fromTo("#s07-btn", { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1, duration: 0.4, ease: "back.out(2.2)" }, 4.4);
          tl.fromTo("#s07-cur", { opacity: 0, x: 1500, y: 960 }, { opacity: 1, x: 470, y: 636, duration: 0.55, ease: "power3.inOut" }, 4.6);
          tl.to("#s07-cur", { scale: 0.7, duration: 0.08, yoyo: true, repeat: 1 }, 5.18);
          tl.to("#s07-btn", { scale: 0.92, duration: 0.08, yoyo: true, repeat: 1 }, 5.18);
          tl.fromTo("#s07-rip", { opacity: 0.9, scale: 0.3, x: 470, y: 636 }, { opacity: 0, scale: 2.2, duration: 0.6, ease: "power2.out" }, 5.2);
          tl.to("#s07-ins", { opacity: 0, y: 220, scale: 0.92, duration: 0.4, ease: "power3.in" }, 7.1);
          tl.to("#s07-bw", { filter: "blur(0px) brightness(1)", duration: 0.4 }, 7.15);

          // Scroll down to the tabs: the top of the page slides away, the Budget tab view rises in
          tl.set("#s07-p0", { opacity: 0 }, 0);
          tl.to("#s07-top", { y: -520, opacity: 0, filter: "blur(8px)", duration: 0.55, ease: "power3.in" }, 7.5);
          tl.fromTo("#s07-p0", { opacity: 0, y: 420, filter: "blur(8px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.6, ease: "power3.out" }, 7.7);
          tl.to("#s07-cur", { x: L + tabX[0] * S, y: tabY, duration: 0.5, ease: "power3.inOut" }, 7.75);

          // Tab montage: click a real tab, its real screen wipes in
          for (let i = 0; i < 6; i++) {
            const t = 8.35 + i * 2.087;
            if (i > 0) {
              tl.to("#s07-cur", { x: L + tabX[i] * S, y: tabY, duration: 0.4, ease: "power3.inOut" }, t - 0.45);
              tl.fromTo("#s07-p" + i, { clipPath: "inset(0 0 0 100%)" }, { clipPath: "inset(0 0 0 0%)", duration: 0.5, ease: "power3.inOut" }, t + 0.05);
              tl.to("#s07-bw", { scale: S * 1.012, duration: 0.15, ease: "power2.out", yoyo: true, repeat: 1 }, t + 0.05);
            }
            tl.to("#s07-cur", { scale: 0.7, duration: 0.08, yoyo: true, repeat: 1 }, t - 0.02);
            tl.fromTo("#s07-rip", { opacity: 0.9, scale: 0.3, x: L + tabX[i] * S, y: tabY }, { opacity: 0, scale: 2, duration: 0.55, ease: "power2.out" }, t);
            showCap(i + 1, t);
          }
          for (let i = 1; i < 6; i++) tl.set("#s07-p" + i, { clipPath: "inset(0 0 0 100%)" }, 0);

          // Push into the Tools tab, handing off to the next chapter
          tl.to("#s07-cur", { opacity: 0, duration: 0.3 }, 22.8);
          tl.to("#s07-bw", { x: -260, y: -240, scale: 1.25, duration: 1.8, ease: "power2.in" }, 22.96);
          tl.to(caps[6], { opacity: 0, y: 30, duration: 0.3 }, 24.4);

          window.__timelines["s07"] = tl;
