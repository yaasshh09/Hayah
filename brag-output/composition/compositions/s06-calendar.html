      <script>
        (function () {
          // Real upcoming occasions from assets/hayati-data.js: [day, month, name, tentative, budget, saved, color]
          const occ = [
            ["2", "DEC", "UAE National Day", false, 1500, 600, "#3cc09b"],
            ["8", "FEB", "Ramadan begins", true, 3400, 600, "#9f8fe0"],
            ["10", "MAR", "Eid Al Fitr", true, 4800, 900, "#9f8fe0"],
            ["17", "MAY", "Eid Al Adha", true, 5400, 1200, "#9f8fe0"],
          ];
          const host = document.getElementById("s06-occs");
          occ.forEach((o, i) => {
            host.insertAdjacentHTML(
              "beforeend",
              `<div class="occ" id="s06-o${i}" style="top:${150 + i * 176}px"><div class="d body" style="background:${o[6]}22;color:${o[6]}"><b>${o[0]}</b><small>${o[1]}</small></div><div class="n disp">${o[2]}</div><div class="t body">${o[3] ? "Tentative" : "Fixed date"}</div><div class="bar"><span id="s06-b${i}" style="background:${o[6]}"></span></div><div class="m body"><span>AED ${o[5].toLocaleString("en-US")} saved</span><span>of AED ${o[4].toLocaleString("en-US")}</span></div></div>`,
            );
          });

          const tl = gsap.timeline({ paused: true });
          // Phase 1: the real calendar, categories pop out of it
          tl.fromTo("#s06-bw", { x: 192, y: 160, scale: 1.05, opacity: 0, filter: "blur(16px)" }, { scale: 0.8, opacity: 1, filter: "blur(0px)", duration: 0.8, ease: "power3.out" }, 0);
          tl.to("#s06-bw", { x: 170, y: 140, scale: 0.82, duration: 2.95, ease: "sine.inOut" }, 0.8);
          tl.fromTo("#s06-head", { opacity: 0, x: -40 }, { opacity: 1, x: 0, duration: 0.4, ease: "power3.out" }, 0.3);
          // beat-grid: one category chip per beat
          tl.fromTo("#s06-cats .chip", { opacity: 0, y: 60, scale: 0.6 }, { opacity: 1, y: 0, scale: 1, duration: 0.4, ease: "back.out(2.4)", stagger: 0.5 }, 1.0);

          // Phase 2 on the drop (beat-locked: 47.94s global)
          tl.to("#s06-bw", { x: 1100, y: 300, scale: 0.4, rotation: 6, opacity: 0, filter: "blur(12px)", duration: 0.5, ease: "power3.in" }, 3.75);
          tl.to("#s06-cats", { y: 200, opacity: 0, duration: 0.45, ease: "power3.in" }, 3.75);
          tl.to("#s06-head", { y: -20, duration: 0.4 }, 3.85);
          tl.fromTo("#s06 h2 .w", { opacity: 0, y: 90, rotation: 4 }, { opacity: 1, y: 0, rotation: 0, duration: 0.45, ease: "back.out(1.6)", stagger: 0.06 }, 3.99);
          tl.fromTo("#s06-cap", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.5, ease: "power2.out" }, 5.0);
          occ.forEach((o, i) => {
            const t = 4.98 + i * 0.5;
            tl.fromTo("#s06-o" + i, { opacity: 0, x: 260, rotation: 3 }, { opacity: 1, x: 0, rotation: 0, duration: 0.55, ease: "power4.out" }, t);
            tl.fromTo("#s06-b" + i, { scaleX: 0 }, { scaleX: o[5] / o[4], duration: 0.9, ease: "power3.out" }, t + 0.3);
          });
          tl.fromTo("#s06-alert", { opacity: 0, y: 40, scale: 0.92 }, { opacity: 1, y: 0, scale: 1, duration: 0.5, ease: "back.out(1.8)" }, 7.5);
          tl.fromTo("#s06-alert i", { scale: 1 }, { scale: 1.5, duration: 0.4, ease: "sine.inOut", yoyo: true, repeat: 7 }, 8.0);
          tl.to("#s06-o2", { x: -16, borderColor: "rgba(159,143,224,0.9)", duration: 0.4, ease: "power2.out" }, 7.5);

          window.__timelines["s06"] = tl;
