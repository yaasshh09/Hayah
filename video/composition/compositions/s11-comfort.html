      <script>
        (function () {
          const tl = gsap.timeline({ paused: true });
          tl.fromTo("#s11-head", { opacity: 0, x: -40 }, { opacity: 1, x: 0, duration: 0.4, ease: "power3.out" }, 0.15);
          tl.fromTo("#s11-ha .w", { opacity: 0, y: 70 }, { opacity: 1, y: 0, duration: 0.45, ease: "power3.out", stagger: 0.08 }, 0.35);
          tl.fromTo("#s11-bw", { x: 640, y: 1100, scale: 0.62, rotation: 3 }, { y: 230, rotation: 0, duration: 0.7, ease: "power3.out" }, 0.45);
          // Theme wipe: the night sweeps across the screen and the page
          tl.set("#s11-dark", { clipPath: "polygon(0% 0%, 0% 0%, 0% 100%, 0% 100%)" }, 0);
          tl.to("#s11-dark", { clipPath: "polygon(0% 0%, 130% 0%, 100% 100%, 0% 100%)", duration: 0.9, ease: "power3.inOut" }, 4.17);
          tl.to("#s11-night", { opacity: 1, duration: 0.9, ease: "power2.inOut" }, 4.17);
          tl.to("#s11-ha", { color: "#ffffff", duration: 0.6 }, 4.27);
          tl.to("#s11-head", { color: "#c7bcf2", duration: 0.6 }, 4.27);
          // ...and back to light
          tl.to("#s11-dark", { clipPath: "polygon(100% 0%, 130% 0%, 100% 100%, 100% 100%)", duration: 0.8, ease: "power3.inOut" }, 8.35);
          tl.to("#s11-night", { opacity: 0, duration: 0.8, ease: "power2.inOut" }, 8.35);
          tl.to("#s11-ha", { color: "#111111", duration: 0.5 }, 8.45);
          tl.to("#s11-head", { color: "#7d6bd1", duration: 0.5 }, 8.45);

          // Phase 2: accessibility settings
          tl.to("#s11-pa", { x: -1400, opacity: 0, duration: 0.55, ease: "power3.in" }, 8.6);
          tl.fromTo("#s11-pb h2 .w", { opacity: 0, y: 70 }, { opacity: 1, y: 0, duration: 0.45, ease: "power3.out", stagger: 0.07 }, 9.05);
          tl.fromTo("#s11-rows", { opacity: 0, x: 300 }, { opacity: 1, x: 0, duration: 0.6, ease: "power3.out" }, 9.25);
          // beat-grid: one setting turns on per beat
          ["#s11-sw0", "#s11-sw1"].forEach((s, i) => {
            const t = 10.35 + i * 0.5;
            tl.to(s, { backgroundColor: "#9f8fe0", duration: 0.2 }, t);
            tl.to(s + " i", { x: 50, duration: 0.25, ease: "back.out(2)" }, t);
          });
          tl.to("#s11-lg", { backgroundColor: "#15131c", color: "#ffffff", duration: 0.2 }, 11.35);
          tl.to("#s11-auto", { backgroundColor: "#15131c", color: "#ffffff", duration: 0.2 }, 11.85);
          tl.fromTo("#s11-cap", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.45, ease: "power2.out" }, 10.55);
          tl.fromTo("#s11-local", { opacity: 0, y: 30, scale: 0.9 }, { opacity: 1, y: 0, scale: 1, duration: 0.45, ease: "back.out(2)" }, 12.55);

          window.__timelines["s11"] = tl;
        })();
