<!doctype html>
<html>
  <head>

  <body>
    <template>
      <style>
        #s01 {
          position: absolute;
          inset: 0;
          overflow: hidden;
          background: #15131c;
          color: #fff;
        }
        #s01 .glow {
          position: absolute;
          width: 1400px;
          height: 1400px;
          left: 260px;
          top: -160px;
          border-radius: 50%;
          background: radial-gradient(circle, rgba(159, 143, 224, 0.42), rgba(159, 143, 224, 0) 65%);
        }
        #s01 .big {
          position: absolute;
          inset: 0;
          display: flex;
          align-items: center;
          justify-content: center;
        }
        #s01 .big span {
          display: block;
          font-size: 230px;
          white-space: nowrap;
          opacity: 0;
        }
        #s01 .tag {
          position: absolute;
          display: flex;
          align-items: baseline;
          gap: 16px;
          padding: 16px 30px;
          border-radius: 18px;
          background: #24212f;
          border: 2px solid rgba(255, 255, 255, 0.1);
          white-space: nowrap;
          opacity: 0;
        }
        #s01 .tag b {
          font-size: 44px;
          font-weight: 800;
          letter-spacing: -0.03em;
        }
        #s01 .tag em {
          font-style: normal;
          font-size: 26px;
          font-weight: 700;
          color: var(--gold);
        }
        #s01 .scrim {
          position: absolute;
          inset: 0;
          background: radial-gradient(ellipse at center, rgba(21, 19, 28, 0.94) 30%, rgba(21, 19, 28, 0.55) 75%);
          opacity: 0;
        }
        #s01 .head {
          position: absolute;
          inset: 0;
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          gap: 34px;
          text-align: center;
        }
        #s01 .head h1 {
          font-size: 128px;
          max-width: 1500px;
        }
        #s01 .head p {
          font-size: 38px;
          font-weight: 600;
          color: rgba(255, 255, 255, 0.7);
        }
        #s01 .hw {
          display: inline-block;
          opacity: 0;
        }
      </style>

      <div id="s01" data-composition-id="s01" data-width="1920" data-height="1080">
        <div class="glow"></div>
        <div id="s01-tags" data-layout-allow-overlap></div>
        <div id="s01-bigs"></div>
        <div class="scrim"></div>
        <div class="head">
          <h1 class="disp">
            <span class="hw">Every</span> <span class="hw">UAE</span> <span class="hw">family</span>
            <span class="hw lav">juggles</span> <span class="hw">all</span> <span class="hw">of</span>
            <span class="hw">this.</span>
          </h1>
          <p class="body hw" id="s01-sub">Ours included. So our team built something about it.</p>
        </div>

        <audio id="s01-a0" src="assets/sfx/riser.wav" data-start="0" data-duration="0.6" data-track-index="100" data-hf-media-start-basis="local" data-volume="0.35"></audio>
        <audio id="s01-a1" src="assets/sfx/impactPunch_medium_000.ogg" data-start="0.5" data-duration="0.4" data-track-index="101" data-hf-media-start-basis="local" data-volume="0.7"></audio>
        <audio id="s01-a2" src="assets/sfx/impactPunch_medium_001.ogg" data-start="1.0" data-duration="0.4" data-track-index="102" data-hf-media-start-basis="local" data-volume="0.7"></audio>
        <audio id="s01-a3" src="assets/sfx/impactPunch_medium_000.ogg" data-start="1.5" data-duration="0.4" data-track-index="101" data-hf-media-start-basis="local" data-volume="0.7"></audio>
        <audio id="s01-a4" src="assets/sfx/impactPunch_medium_001.ogg" data-start="2.0" data-duration="0.4" data-track-index="102" data-hf-media-start-basis="local" data-volume="0.7"></audio>
        <audio id="s01-a5" src="assets/sfx/impactPunch_medium_000.ogg" data-start="2.49" data-duration="0.4" data-track-index="101" data-hf-media-start-basis="local" data-volume="0.7"></audio>
        <audio id="s01-a6" src="assets/sfx/impactPunch_medium_001.ogg" data-start="2.99" data-duration="0.4" data-track-index="102" data-hf-media-start-basis="local" data-volume="0.7"></audio>
        <audio id="s01-a7" src="assets/sfx/impactPunch_medium_000.ogg" data-start="3.49" data-duration="0.4" data-track-index="101" data-hf-media-start-basis="local" data-volume="0.7"></audio>
        <audio id="s01-a8" src="assets/sfx/impactPunch_medium_001.ogg" data-start="3.99" data-duration="0.4" data-track-index="102" data-hf-media-start-basis="local" data-volume="0.7"></audio>
        <audio id="s01-a9" src="assets/sfx/impactPunch_medium_000.ogg" data-start="4.49" data-duration="0.4" data-track-index="101" data-hf-media-start-basis="local" data-volume="0.7"></audio>
        <audio id="s01-a10" src="assets/sfx/impactPunch_medium_001.ogg" data-start="4.99" data-duration="0.4" data-track-index="102" data-hf-media-start-basis="local" data-volume="0.75"></audio>
        <audio id="s01-s1" src="assets/sfx/swish.wav" data-start="0.88" data-duration="0.4" data-track-index="103" data-hf-media-start-basis="local" data-volume="0.35"></audio>
        <audio id="s01-s2" src="assets/sfx/swish.wav" data-start="1.88" data-duration="0.4" data-track-index="103" data-hf-media-start-basis="local" data-volume="0.35"></audio>
        <audio id="s01-s3" src="assets/sfx/swish.wav" data-start="2.87" data-duration="0.4" data-track-index="103" data-hf-media-start-basis="local" data-volume="0.35"></audio>
        <audio id="s01-s4" src="assets/sfx/swish.wav" data-start="3.87" data-duration="0.4" data-track-index="103" data-hf-media-start-basis="local" data-volume="0.35"></audio>
        <audio id="s01-s5" src="assets/sfx/swish.wav" data-start="4.87" data-duration="0.4" data-track-index="103" data-hf-media-start-basis="local" data-volume="0.35"></audio>
        <audio id="s01-g1" src="assets/sfx/glitch_004.ogg" data-start="5.45" data-duration="0.3" data-track-index="104" data-hf-media-start-basis="local" data-volume="0.5"></audio>
        <audio id="s01-b1" src="assets/sfx/boom.wav" data-start="5.6" data-duration="1.6" data-track-index="105" data-hf-media-start-basis="local" data-volume="0.75"></audio>
        <audio id="s01-d1" src="assets/sfx/drop_002.ogg" data-start="6.9" data-duration="0.4" data-track-index="106" data-hf-media-start-basis="local" data-volume="0.6"></audio>
      </div>

      <script>
        (function () {
          // [label, amount, tagLeft, tagTop, rotation]
          const items = [
            ["Rent", "AED 9,500", 130, 120, -4],
            ["School fees", "AED 14,200", 1340, 110, 3],
            ["DEWA", "AED 860", 1450, 860, -3],
            ["Groceries", "AED 3,500", 160, 820, 4],
            ["Eidiya", "AED 1,200", 720, 70, -2],
            ["Ramadan iftars", "AED 2,400", 90, 470, 2],
            ["Summer travel", "AED 11,000", 1280, 470, -3],
            ["Car loan", "AED 1,850", 720, 930, 3],
            ["Birthdays", "AED 600", 520, 300, -6],
            ["Zakat", "AED 1,975", 1180, 690, 5],
          ];
          const tagsEl = document.getElementById("s01-tags");
          const bigsEl = document.getElementById("s01-bigs");
          items.forEach((it, i) => {
            tagsEl.insertAdjacentHTML(
              "beforeend",
              `<div class="tag" id="s01-t${i}" style="left:${it[2]}px;top:${it[3]}px"><b class="disp">${it[0]}</b><em class="body">${it[1]}</em></div>`,
            );
            bigsEl.insertAdjacentHTML(
              "beforeend",
              `<div class="big"><span class="disp" id="s01-w${i}">${it[0]}.</span></div>`,
            );
          });

          const tl = gsap.timeline({ paused: true });
          // beat-grid: words on every beat from 0.52s (120 BPM)
          items.forEach((it, i) => {
            const t = 0.52 + i * 0.4993;
            const w = "#s01-w" + i;
            const tag = "#s01-t" + i;
            const dx = it[2] + 160 - 960;
            const dy = it[3] + 40 - 540;
            tl.fromTo(w, { opacity: 0, scale: 1.7, filter: "blur(18px)" }, { opacity: 1, scale: 1, filter: "blur(0px)", duration: 0.16, ease: "power4.out" }, t - 0.02);
            tl.to(w, { x: dx, y: dy, scale: 0.2, opacity: 0, duration: 0.24, ease: "power3.in" }, t + 0.34);
            tl.fromTo(tag, { opacity: 0, scale: 0.4, rotation: it[4] * 3 }, { opacity: 1, scale: 1, rotation: it[4], duration: 0.36, ease: "back.out(2.2)" }, t + 0.5);
          });

          // The pile gets restless
          for (let i = 0; i < items.length; i++) {
            const dir = i % 2 ? 1 : -1;
            tl.to("#s01-t" + i, { x: dir * 6, duration: 0.08, ease: "none", yoyo: true, repeat: 7 }, 5.42 + i * 0.01);
            tl.to("#s01-t" + i, { scale: 1.08, opacity: 0.35, filter: "blur(3px)", duration: 0.6, ease: "power2.out" }, 5.6);
          }
          tl.to("#s01 .glow", { scale: 1.25, opacity: 0.6, duration: 1.2, ease: "sine.out" }, 5.5);

          // Headline lands word by word, then the confession line
          tl.to("#s01 .scrim", { opacity: 1, duration: 0.5, ease: "power2.out" }, 5.5);
          tl.fromTo("#s01 h1 .hw", { opacity: 0, y: 60, rotationX: -70 }, { opacity: 1, y: 0, rotationX: 0, duration: 0.5, ease: "power3.out", stagger: 0.07 }, 5.58);
          tl.fromTo("#s01-sub", { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.5, ease: "power2.out" }, 6.9);
          tl.to("#s01 .head", { scale: 1.04, duration: 2.4, ease: "none" }, 5.6);

          window.__timelines["s01"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
