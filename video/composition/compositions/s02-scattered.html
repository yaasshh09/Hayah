      <script>
        (function () {
          const tl = gsap.timeline({ paused: true });
          const frags = [
            ["#s02-sheet", -8, -260, 0.49],
            ["#s02-cal", 7, 220, 0.99],
            ["#s02-note", -6, -180, 1.49],
            ["#s02-sms", 4, 0, 1.99],
            ["#s02-chat", -5, 240, 2.49],
          ];
          // beat-grid: one fragment per beat
          frags.forEach(([sel, rot, dx, t]) => {
            tl.fromTo(sel, { opacity: 0, x: dx, y: 120, rotation: rot * 3, scale: 0.7 }, { opacity: 1, x: 0, y: 0, rotation: rot, scale: 1, duration: 0.55, ease: "back.out(1.6)" }, t);
            tl.to(sel, { y: "+=" + (rot > 0 ? 26 : -26), rotation: rot * 1.4, duration: 3.4, ease: "sine.inOut" }, t + 0.6);
          });
          tl.fromTo("#s02-chat .b", { opacity: 0, y: 16, scale: 0.9 }, { opacity: 1, y: 0, scale: 1, duration: 0.3, ease: "back.out(2)", stagger: 0.35 }, 2.85);

          tl.fromTo("#s02 .kicker", { opacity: 0, x: -30 }, { opacity: 1, x: 0, duration: 0.4, ease: "power2.out" }, 0.25);
          tl.fromTo("#s02-h1 .w:not(.sub)", { opacity: 0, y: 70 }, { opacity: 1, y: 0, duration: 0.45, ease: "power3.out", stagger: 0.06 }, 0.35);
          tl.fromTo("#s02-sub", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.45, ease: "power2.out" }, 1.7);

          // Glitch: fragments split and shake
          ["#s02-sheet", "#s02-cal", "#s02-note", "#s02-sms", "#s02-chat"].forEach((sel, i) => {
            tl.to(sel, { x: i % 2 ? 14 : -14, skewX: i % 2 ? 6 : -6, duration: 0.05, ease: "none", yoyo: true, repeat: 5 }, 4.0 + i * 0.02);
            tl.to(sel, { opacity: 0.55, filter: "saturate(0.3) blur(1.5px)", duration: 0.4 }, 4.4);
          });

          // Headline swap
          tl.to("#s02-h1 .w", { opacity: 0, y: -50, duration: 0.3, ease: "power2.in", stagger: 0.02 }, 4.3);
          tl.fromTo("#s02-h2 .w", { opacity: 0, y: 70 }, { opacity: 1, y: 0, duration: 0.45, ease: "power3.out", stagger: 0.07 }, 4.55);

          // Everything gets pulled to the center for the reveal

          ["#s02-sheet", "#s02-cal", "#s02-note", "#s02-sms", "#s02-chat"].forEach((sel, i) => {
            tl.to(sel, { x: 760 - base[sel][0], y: 400 - base[sel][1], rotation: (i % 2 ? 1 : -1) * 120, scale: 0.05, opacity: 1, filter: "none", duration: 1.0, ease: "power4.in" }, 6.9 + i * 0.04);
          });
          tl.to("#s02 .left", { opacity: 0, scale: 0.9, filter: "blur(10px)", duration: 0.6, ease: "power2.in" }, 7.1);
          tl.to("#s02 .glow", { x: -590, y: 90, scale: 1.6, duration: 1.1, ease: "power3.in" }, 6.85);

          window.__timelines["s02"] = tl;
