        (function () {
          const tl = gsap.timeline({ paused: true });
          const fmt = (n) => Math.round(n).toLocaleString("en-US");
          const countUp = (sel, to, t, d) => {
            const o = { v: 0 };
            const el = document.querySelector(sel);
            tl.fromTo(o, { v: 0 }, { v: to, duration: d, ease: "power3.out", onUpdate: () => (el.textContent = "AED " + fmt(o.v)) }, t);
          };
          tl.fromTo("#s08-head", { opacity: 0, x: -40 }, { opacity: 1, x: 0, duration: 0.4, ease: "power3.out" }, 0.2);
          tl.fromTo("#s08 h2 .w", { opacity: 0, y: 70 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out", stagger: 0.08 }, 0.4);
          [0, 1, 2].forEach((i) => {
            const t = 1.6 + i * 1.0;
            tl.fromTo("#s08-t" + i, { opacity: 0, y: 160, rotationX: -30, transformPerspective: 1600 }, { opacity: 1, y: 0, rotationX: 0, duration: 0.7, ease: "power3.out" }, t);
            tl.fromTo("#s08-t" + i + " .in", { opacity: 0, x: -24 }, { opacity: 1, x: 0, duration: 0.3, ease: "power2.out", stagger: 0.15 }, t + 0.35);
          });
          // Results land one by one after all inputs are in
          const res = [1850, 60000, 1975];
          res.forEach((v, i) => {
            const t = 4.7 + i * 0.5;
            tl.fromTo("#s08-t" + i + " .res", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.4, ease: "back.out(1.6)" }, t);
            countUp("#s08-v" + i, v, t, 1.0);
            tl.fromTo("#s08-t" + i, { scale: 1 }, { scale: 1.03, duration: 0.15, yoyo: true, repeat: 1, ease: "power2.out" }, t);
          });
          tl.fromTo("#s08-cap", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.5, ease: "power2.out" }, 6.3);
          tl.to(["#s08-t0", "#s08-t2"], { y: -10, duration: 5, ease: "sine.inOut" }, 6.9);
          tl.to("#s08-t1", { y: 10, duration: 5, ease: "sine.inOut" }, 6.9);
