<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#ffffff" />
    <title>Hayati AI</title>
    <link rel="icon" type="image/png" href="/assets/hayati-mark.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,300..800&family=Instrument+Sans:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        color-scheme: light;
        --ink: #111;
        --mut: #85858c;
        --lav: #9f8fe0;
        --mint: #7fe0c3;
        --gold: #e8b765;
        --line: #e4e4e8;
        --ease: cubic-bezier(0.2, 0.8, 0.2, 1);
        box-sizing: border-box;
        padding-bottom: env(safe-area-inset-bottom, 0px);
      }
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        cursor: none !important;
      }
      @media (pointer: coarse) {
        *,
        *::before,
        *::after {
          cursor: auto !important;
        }
        .c-cursor {
          display: none !important;
        }
      }
      html {
        scroll-padding-top: env(safe-area-inset-top, 0px);
      }
      body {
        background: #fff;
        color: var(--ink);
        font:
          400 15px/1.6 "Instrument Sans",
          -apple-system,
          sans-serif;
        -webkit-font-smoothing: antialiased;
        overflow-x: hidden;
        isolation: isolate;
        min-height: 100vh;
      }
      h1,
      h2,
      h3 {
        font-family: "Bricolage Grotesque", sans-serif;
      }
      a {
        color: inherit;
        text-decoration: none;
      }
      button,
      textarea {
        font: inherit;
        color: inherit;
      }
      :focus-visible {
        outline: 2px solid var(--lav);
        outline-offset: 3px;
      }
      .au {
        position: fixed;
        inset: 0;
        z-index: -2;
        overflow: hidden;
        pointer-events: none;
      }
      .au i {
        position: absolute;
        width: 55vw;
        height: 55vw;
        border-radius: 50%;
        filter: blur(110px);
        opacity: 0.7;
        animation: dr 30s ease-in-out infinite alternate;
      }
      .au i:nth-child(1) {
        background: #dcd3ff;
        left: -10vw;
        top: -12vw;
      }
      .au i:nth-child(2) {
        background: #c5f1e2;
        right: -14vw;
        top: 8vw;
        animation-delay: -8s;
      }
      .au i:nth-child(3) {
        background: #ffe5b8;
        left: 22vw;
        bottom: -22vw;
        animation-delay: -15s;
      }
      .au i:nth-child(4) {
        background: #ffd6e7;
        right: 10vw;
        bottom: -14vw;
        width: 48vw;
        height: 48vw;
        animation-delay: -22s;
      }
      @keyframes dr {
        to {
          transform: translate3d(5vw, 4vh, 0) scale(1.08);
        }
      }
      .glow {
        position: fixed;
        left: 0;
        right: 0;
        bottom: 0;
        height: 58vh;
        z-index: -1;
        pointer-events: none;
        background:
          radial-gradient(
            90% 100% at 50% 112%,
            rgba(159, 143, 224, 0.55),
            rgba(159, 143, 224, 0.16) 46%,
            transparent 72%
          ),
          radial-gradient(
            55% 70% at 88% 112%,
            rgba(197, 241, 226, 0.7),
            transparent 70%
          ),
          radial-gradient(
            55% 70% at 12% 112%,
            rgba(255, 214, 231, 0.65),
            transparent 70%
          );
      }
      .waves {
        position: fixed;
        left: 0;
        bottom: 0;
        width: 200%;
        height: 30vh;
        z-index: -1;
        pointer-events: none;
        animation: wv 46s linear infinite;
      }
      .waves path {
        fill: none;
        stroke-width: 1.2;
        vector-effect: non-scaling-stroke;
      }
      @keyframes wv {
        to {
          transform: translateX(-50%);
        }
      }
      nav {
        position: fixed;
        top: env(safe-area-inset-top, 0px);
        left: 0;
        right: 0;
        z-index: 20;
        display: grid;
        grid-template-columns: 1fr auto 1fr;
        align-items: center;
        gap: 16px;
        padding: 14px 6vw;
        font-size: 14px;
        transition:
          background 0.3s,
          border-color 0.3s;
        border-bottom: 1px solid transparent;
      }
      nav.s {
        background: rgba(255, 255, 255, 0.8);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        border-color: rgba(0, 0, 0, 0.06);
      }
      .bl {
        display: flex;
        align-items: center;
        gap: 16px;
        justify-self: start;
      }
      .brand img {
        display: block;
        height: 30px;
        width: auto;
      }
      .sec {
        padding-left: 16px;
        border-left: 1px solid rgba(0, 0, 0, 0.16);
        height: 24px;
        display: flex;
        align-items: center;
        font-size: 12px;
        font-weight: 500;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: #7c7c83;
      }
      .tabs {
        display: flex;
        gap: 6px;
        padding: 4px;
        border-radius: 99px;
        background: rgba(255, 255, 255, 0.7);
        backdrop-filter: blur(14px);
        box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.05);
      }
      .tabs a {
        padding: 8px 18px;
        border-radius: 99px;
        color: #666670;
        transition:
          color 0.2s,
          background 0.3s;
      }
      .tabs a:hover {
        color: var(--ink);
      }
      .tabs a.on {
        background: var(--ink);
        color: #fff;
        font-weight: 500;
      }
      .seg {
        display: flex;
        padding: 3px;
        border-radius: 99px;
        background: rgba(0, 0, 0, 0.06);
        justify-self: end;
      }
      .seg button {
        border: 0;
        background: none;
        padding: 7px 16px;
        border-radius: 99px;
        font-size: 13px;
        font-weight: 500;
        color: #666670;
        transition:
          background 0.3s var(--ease),
          color 0.3s;
      }
      .seg button[aria-pressed="true"] {
        background: #fff;
        color: var(--ink);
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
      }
      @media (max-width: 1000px) {
        nav {
          padding-inline: 20px;
        }
      }
      @media (max-width: 760px) {
        .tabs {
          display: none;
        }
        nav {
          grid-template-columns: 1fr auto;
        }
      }
      .page {
        padding: 80px 6vw 0;
      }
      .rule {
        height: 1px;
        background: var(--rule, rgba(0, 0, 0, 0.09));
      }
      .ai {
        min-height: calc(100vh - 82px);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 34px 0 40px;
      }
      .ai.chat {
        justify-content: flex-start;
      }
      .hero {
        display: grid;
        grid-template-rows: 1fr;
        text-align: center;
        transition:
          grid-template-rows 0.8s var(--ease),
          opacity 0.5s,
          margin 0.8s var(--ease);
        margin-bottom: clamp(28px, 4vw, 52px);
      }
      .hero > div {
        min-height: 0;
      }
      .chat .hero > div {
        overflow: hidden;
      }
      .chat .hero {
        grid-template-rows: 0fr;
        opacity: 0;
        margin-bottom: 0;
      }
      .orb {
        width: 58px;
        height: 58px;
        border-radius: 50%;
        margin: 0 auto 22px;
        position: relative;
        isolation: isolate;
        background: radial-gradient(
          circle at 34% 28%,
          #fff 0%,
          #f4efff 10%,
          #d7caff 25%,
          #abbcf7 48%,
          #eebfe0 72%,
          #f8d9c1 100%
        );
        box-shadow:
          inset -5px -7px 14px rgba(107, 91, 174, 0.16),
          inset 3px 4px 10px rgba(255, 255, 255, 0.85),
          0 7px 22px -6px rgba(143, 123, 220, 0.45);
        animation: pulse 5s ease-in-out infinite;
      }
      .orb::before {
        content: "";
        position: absolute;
        z-index: -1;
        inset: -24px;
        border-radius: 50%;
        background: radial-gradient(
          circle,
          rgba(193, 177, 255, 0.5),
          rgba(185, 203, 255, 0.25) 40%,
          transparent 70%
        );
        filter: blur(8px);
        animation: glw 3.8s ease-in-out infinite;
      }
      @keyframes pulse {
        50% {
          transform: scale(1.04);
        }
      }
      @keyframes glw {
        0%,
        100% {
          opacity: 0.6;
        }
        50% {
          opacity: 1;
        }
      }
      .hero h1 {
        font-size: clamp(40px, 6.2vw, 100px);
        font-weight: 600;
        line-height: 1;
        letter-spacing: -0.055em;
      }
      .hero h1 span {
        color: var(--lav);
      }
      .hero p {
        max-width: 540px;
        margin: clamp(16px, 1.6vw, 24px) auto 0;
        color: var(--mut);
        font-size: clamp(14px, 1.1vw, 17px);
        line-height: 1.5;
      }
      .thread {
        width: min(780px, 100%);
        display: grid;
        gap: 18px;
        padding-bottom: 22px;
      }
      .msg {
        animation: up 0.5s var(--ease) both;
      }
      @keyframes up {
        from {
          opacity: 0;
          transform: translateY(12px);
        }
      }
      .msg.u {
        justify-self: end;
        max-width: 82%;
        padding: 12px 20px;
        border-radius: 22px 22px 6px 22px;
        background: var(--ink);
        color: #fff;
      }
      .msg.a {
        display: flex;
        gap: 12px;
        align-items: flex-start;
      }
      .av {
        width: 32px;
        height: 32px;
        border-radius: 50%;
        flex: none;
        margin-top: 4px;
        background: radial-gradient(
          circle at 34% 28%,
          #fff,
          #d7caff 30%,
          #abbcf7 56%,
          #eebfe0 80%,
          #f8d9c1
        );
        box-shadow: 0 4px 12px -3px rgba(143, 123, 220, 0.5);
      }
      .bub {
        padding: 16px 22px;
        border-radius: 6px 24px 24px 24px;
        background: rgba(255, 255, 255, 0.82);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        box-shadow:
          0 18px 40px -22px rgba(60, 40, 140, 0.3),
          0 0 0 1px rgba(255, 255, 255, 0.9) inset;
        max-width: 100%;
        min-width: 0;
      }
      .bub p + p,
      .bub p + ul,
      .bub ul + p {
        margin-top: 10px;
      }
      .bub ul {
        padding-left: 20px;
        display: grid;
        gap: 5px;
      }
      .bub li::marker {
        color: var(--lav);
      }
      .bub b {
        font-weight: 600;
      }
      .bub.err {
        color: #914e4e;
      }
      .sk i {
        display: block;
        height: 10px;
        border-radius: 9px;
        margin: 9px 0;
        background: linear-gradient(
          90deg,
          rgba(0, 0, 0, 0.05),
          rgba(159, 143, 224, 0.28),
          rgba(0, 0, 0, 0.05)
        );
        background-size: 200% 100%;
        animation: sh 1.3s linear infinite;
      }
      .sk i:nth-child(1) {
        width: 260px;
      }
      .sk i:nth-child(2) {
        width: 200px;
      }
      .sk i:nth-child(3) {
        width: 130px;
      }
      @keyframes sh {
        to {
          background-position: -200% 0;
        }
      }

      .c-cursor {
        position: fixed;
        inset: auto;
        top: 0;
        left: 0;
        margin: 0;
        padding: 0;
        overflow: visible;
        width: 14px;
        height: 14px;
        border: 1.5px solid rgba(18, 18, 22, 0.7);
        border-radius: 50%;
        background: rgba(18, 18, 22, 0.08);
        pointer-events: none;
        z-index: 999999;
        transform: translate3d(-50%, -50%, 0);
        transition:
          width 0.32s cubic-bezier(0.16, 1, 0.3, 1),
          height 0.32s cubic-bezier(0.16, 1, 0.3, 1),
          border-color 0.25s,
          background 0.25s,
          box-shadow 0.25s,
          opacity 0.2s;
      }
      .c-cursor.hover {
        width: 50px;
        height: 50px;
        border-color: var(--lav);
        background: rgba(159, 143, 224, 0.18);
        box-shadow: 0 0 24px rgba(159, 143, 224, 0.35);
      }

      .ai {
        padding: 34px 0 200px;
      }
      .thread {
        padding-bottom: 6px;
      }
      .dock {
        position: fixed;
        left: 0;
        right: 0;
        bottom: 0;
        z-index: 6;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 12px;
        padding: 0 20px max(16px, env(safe-area-inset-bottom));
        pointer-events: none;
      }
      .dock::before {
        content: "";
        position: absolute;
        inset: -60px 0 0;
        z-index: -1;
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
        -webkit-mask-image: linear-gradient(to top, #000 50%, transparent);
        mask-image: linear-gradient(to top, #000 50%, transparent);
      }
      .dock > * {
        pointer-events: auto;
      }
      .chips {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        justify-content: center;
        max-width: 780px;
        max-height: 120px;
        transition:
          opacity 0.45s,
          max-height 0.6s var(--ease),
          transform 0.5s var(--ease);
      }
      .chat .chips {
        opacity: 0;
        max-height: 0;
        transform: translateY(10px);
        overflow: hidden;
        pointer-events: none;
      }
      .chip {
        height: 38px;
        padding: 0 16px;
        border: 0;
        border-radius: 99px;
        background: rgba(255, 255, 255, 0.8);
        backdrop-filter: blur(10px);
        box-shadow: inset 0 0 0 1px rgba(0, 0, 0, 0.07);
        font-size: 13px;
        color: #4a4a52;
        transition: all 0.3s var(--ease);
      }
      .chip:hover {
        background: var(--ink);
        color: #fff;
        transform: translateY(-2px);
      }
      .bw {
        position: relative;
        width: min(780px, 100%);
      }
      .halo {
        position: absolute;
        inset: -10px;
        border-radius: 42px;
        background: linear-gradient(
          110deg,
          #9f8fe0,
          #7fe0c3 30%,
          #ffd6e7 62%,
          #9f8fe0
        );
        background-size: 250% 100%;
        filter: blur(20px);
        opacity: 0;
        transition: opacity 0.5s;
      }
      .bw:focus-within .halo {
        opacity: 0.4;
      }
      .bw.busy .halo,
      .bw.listening .halo {
        opacity: 0.85;
        animation: flow 2.2s linear infinite;
      }
      @keyframes flow {
        to {
          background-position: -250% 0;
        }
      }
      .ring {
        position: absolute;
        inset: 0;
        border-radius: 32px;
        border: 2px solid rgba(159, 143, 224, 0.85);
        opacity: 0;
        pointer-events: none;
      }
      .bw.pulse .ring {
        animation: rad 1.15s cubic-bezier(0.2, 0.7, 0.3, 1);
      }
      @keyframes rad {
        0% {
          opacity: 0.95;
          transform: scale(1);
        }
        100% {
          opacity: 0;
          transform: scale(1.06, 1.9);
        }
      }
      .pb {
        position: relative;
        display: flex;
        align-items: flex-end;
        gap: 4px;
        padding: 10px 10px 10px 26px;
        border-radius: 32px;
        background: rgba(251, 251, 247, 0.9);
        backdrop-filter: blur(26px) saturate(160%);
        -webkit-backdrop-filter: blur(26px) saturate(160%);
        box-shadow: 0 18px 48px -28px rgba(36, 34, 48, 0.24);
        transition: box-shadow 0.4s;
      }
      .pb:focus-within {
        box-shadow: 0 18px 48px -28px rgba(36, 34, 48, 0.24);
      }
      .pb textarea {
        flex: 1;
        min-width: 0;
        min-height: 44px;
        max-height: 200px;
        padding: 10px 0;
        border: 0;
        outline: 0;
        resize: none;
        background: none;
        font-size: 16px;
        line-height: 24px;
      }
      .pb textarea::placeholder {
        color: #a3a3ab;
      }
      .ib {
        height: 44px;
        min-width: 44px;
        padding: 0;
        border: 0;
        border-radius: 50%;
        background: none;
        color: #55555c;
        display: grid;
        place-items: center;
        font:
          600 12px "Instrument Sans",
          -apple-system,
          sans-serif;
        letter-spacing: 0.06em;
        transition:
          background 0.25s,
          color 0.25s,
          transform 0.3s var(--ease);
      }
      .ib:hover {
        background: rgba(0, 0, 0, 0.06);
        color: var(--ink);
      }
      .ib svg {
        width: 20px;
        height: 20px;
      }
      .ib[aria-pressed="true"] {
        background: var(--ink);
        color: #fff;
      }
      .ib.on {
        background: #e4605f;
        color: #fff;
        animation: mp 1.3s ease-out infinite;
      }
      @keyframes mp {
        0% {
          box-shadow: 0 0 0 0 rgba(228, 96, 95, 0.5);
        }
        100% {
          box-shadow: 0 0 0 14px rgba(228, 96, 95, 0);
        }
      }
      .go {
        width: 44px;
        height: 44px;
        border: 0;
        border-radius: 50%;
        background: linear-gradient(135deg, #16161c, #3b3070);
        color: #fff;
        display: grid;
        place-items: center;
        flex: none;
        margin-left: 4px;
        transition:
          transform 0.3s cubic-bezier(0.3, 1.5, 0.4, 1),
          opacity 0.3s;
      }
      .go:hover:not(:disabled) {
        transform: scale(1.08);
      }
      .go:disabled {
        opacity: 0.4;
      }
      .go svg {
        width: 19px;
        height: 19px;
      }
      .fine {
        font-size: 12px;
        color: #8e8e96;
        text-align: center;
        max-width: 620px;
        min-height: 18px;
      }
      @media (max-width: 600px) {
        #lang {
          display: none;
        }
      }

      :root {
        --gut: 6vw;
        --sb: 288px;
      }
      @media (max-width: 1000px) {
        :root {
          --gut: 20px;
        }
      }
      @media (max-width: 900px) {
        :root {
          --sb: 0px;
        }
      }
      .page {
        padding: 80px var(--gut) 0;
      }
      .shell {
        display: grid;
        grid-template-columns: var(--sb) minmax(0, 1fr);
        min-height: calc(100vh - 81px);
      }
      .sb {
        position: sticky;
        top: 81px;
        align-self: start;
        height: calc(100vh - 81px);
        display: flex;
        flex-direction: column;
        gap: 16px;
        padding: 28px 28px 24px 0;
        border-right: 1px solid rgba(0, 0, 0, 0.09);
      }
      .nc {
        display: flex;
        align-items: center;
        gap: 10px;
        height: 46px;
        padding: 0 16px;
        border-radius: 16px;
        border: 0;
        background: rgba(255, 255, 255, 0.72);
        box-shadow: 0 2px 8px rgba(32, 30, 46, 0.035);
        font:
          600 14px "Instrument Sans",
          -apple-system,
          sans-serif;
        transition:
          background 0.22s var(--ease),
          box-shadow 0.22s var(--ease),
          color 0.22s var(--ease);
      }
      .nc:hover {
        background: #fff;
        box-shadow: 0 5px 14px rgba(50, 42, 84, 0.08);
        color: #51457e;
      }
      .nc:active {
        background: rgba(159, 143, 224, 0.08);
        box-shadow: none;
      }
      .nc svg {
        width: 17px;
        height: 17px;
        color: #7668b2;
        transition: color 0.22s var(--ease);
      }
      .search-wrap {
        position: relative;
      }
      .search-halo {
        position: absolute;
        inset: -10px;
        border-radius: 26px;
        background: linear-gradient(
          110deg,
          #9f8fe0,
          #7fe0c3 30%,
          #ffd6e7 62%,
          #9f8fe0
        );
        filter: blur(20px);
        opacity: 0;
        transition: opacity 0.5s;
        pointer-events: none;
      }
      .search-wrap:focus-within .search-halo {
        opacity: 0.4;
      }
      .cs {
        position: relative;
        z-index: 1;
        width: 100%;
        height: 42px;
        padding: 0 14px;
        border-radius: 15px;
        border: 0;
        background: rgba(255, 255, 255, 0.55);
        font:
          400 14px "Instrument Sans",
          -apple-system,
          sans-serif;
        outline: 0;
        transition:
          border-color 0.2s,
          box-shadow 0.2s;
      }
      .cs::placeholder {
        color: #a3a3ab;
      }
      .cs:focus {
        box-shadow: none;
      }
      .cl {
        flex: 1;
        min-height: 0;
        overflow-y: auto;
        margin-right: -12px;
        padding-right: 12px;
        scrollbar-width: thin;
        scrollbar-color: rgba(74, 70, 88, 0.2) transparent;
        transition: scrollbar-color 0.2s;
      }
      .cl:hover {
        scrollbar-color: rgba(74, 70, 88, 0.4) transparent;
      }
      .cl::-webkit-scrollbar {
        width: 8px;
      }
      .cl::-webkit-scrollbar-track {
        background: transparent;
        margin: 8px 0;
      }
      .cl::-webkit-scrollbar-thumb {
        border: 2px solid transparent;
        border-radius: 99px;

      .ct {

      .ci.on .ct {
        color: #2c2350;

      }
      .cx {
        width: 30px;
        height: 30px;
        margin-right: 6px;
        border: 0;
        border-radius: 8px;
        background: none;
        color: #8e8e96;
        display: grid;
        place-items: center;
        opacity: 0;
        flex: none;
        transition:
          opacity 0.2s,
          background 0.2s;
      }
      .ci:hover .cx,
      .cx:focus-visible {
        opacity: 1;
      }
      .cx:hover {
        background: rgba(0, 0, 0, 0.08);

      .cx svg {

      .emp {

      .sbf {

      .sbt,
      .scrim {

      .ai {

      .hero {

      .thread {

      .msg.u {

      .bub {

      .dock {
        left: calc(var(--gut) + var(--sb));

      @media (max-width: 900px) {
        .shell {
          grid-template-columns: 1fr;

        .sb {
          position: fixed;

          background: rgba(255, 255, 255, 0.95);

        .sb.open {

        .scrim {
          display: block;

          background: rgba(20, 20, 30, 0.25);

        .sb.open + .scrim {
          opacity: 1;

        .sbt {
          display: inline-flex;
          position: absolute;
          top: 16px;

          align-items: center;

          border-radius: 12px;
          border: 1px solid rgba(0, 0, 0, 0.12);

        .ai {

        .dock {

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          animation: none !important;

      .nav-actions {

      @media (max-width: 760px) {
        nav .nav-actions {
          grid-column: 2;

      body.ai-page #nav {
        border-bottom: 0 !important;

      html[data-theme="dark"] body.ai-page #nav.s {
        color: var(--hayati-ink);
        background: var(--hayati-nav);

      html[data-theme="dark"] body.ai-page #nav .tabs,

    <script>
      const AI_ENDPOINT = "/api/ai";

      const $ = (s) => document.querySelector(s),
        esc = (s) =>
          s.replace(
            /[&<>"]/g,
            (c) =>
              ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c],
          );
      let role =
          new URLSearchParams(location.search).get("role") === "child"
            ? "child"
            : "adult",
        convo = [],
        busy = false;

      // Live family + finance data from the shared store (children only get their jars).
      const ctx = (r) => HayatiData.aiContext(r);
      const SYSTEM = {
        adult:
          "You are Hayati AI, a warm, practical assistant inside a UAE family planner. Use only the family data provided and say so if something is missing. Amounts are in AED. Islamic dates are tentative until moon sighting. Keep answers short, clear and actionable, using short paragraphs or bullet points. Reply in the same language the user writes in (English or Arabic).",
        child:
          "You are Hayati AI talking to a child of about 9 in the UAE. Use simple, friendly, encouraging words and short sentences. Talk about saving, spending and giving (Sadaqa). Never share or discuss the parents' budgets. Keep it under 120 words. Reply in the same language the child writes in (English or Arabic).",
      };
      const CH = {
        adult: [
          [
            "Eid budget plan",
            "Help me plan the budget for Eid Al Adha next year.",
          ],
          [
            "Summer travel savings",
            "How much should we save each month for summer travel?",
          ],
          [
            "School term costs",
            "Forecast our school term costs for the next year.",
          ],
          ["Spending check", "Where did we overspend this month?"],
        ],
        child: [
          ["My bicycle goal", "How close am I to my bicycle?"],
          ["Split my Eidiya", "How should I split my Eidiya?"],
          ["What is Sadaqa?", "What is Sadaqa?"],
          ["Saving challenge", "Give me a fun saving challenge."],
        ],
      };
      const SUB = {
        adult:
          "Eid budgets, school-term costs, savings plans. Hayati AI knows your family's calendar and occasions.",
        child:
          "Ask about saving, spending and giving. Hayati AI helps you reach your goals.",
      };
      const PH = {
        adult: "Ask about budgets, occasions or savings…",
        child: "Ask me about saving, spending and giving…",
      };

      function demo(p) {
        const t = p.toLowerCase();
        if (/[\u0600-\u06FF]/.test(p))
          return "هذا رد تجريبي. عند ربط Gemini سأجيبك بالعربية عن ميزانية العيد والادخار وجميع مناسبات العائلة.";
        if (role === "child") {
          const k = ctx("child").pocketMoney,
            left = Math.max(0, k.goal.cost - k.goal.saved);
          if (/bicycle|bike|goal|close/.test(t))
            return `You have saved **AED ${k.goal.saved}** of the **AED ${k.goal.cost}** you need for ${k.goal.item.toLowerCase()}. ${left ? `Only **AED ${left}** to go!` : "You did it!"}
- Keep your save jar growing each week
- Your next Eidiya could finish the goal
You are ${Math.min(100, Math.round((k.goal.saved / k.goal.cost) * 100))}% of the way there. Well done!`;
          if (/jar|have|money/.test(t))
            return `Here is what is in your jars right now:
- **Save:** AED ${k.jars.save}
- **Spend:** AED ${k.jars.spend}
- **Give:** AED ${k.jars.give}
You have already given **AED ${k.totalGivenAsSadaqa}** as Sadaqa. That is wonderful!`;
          if (/eidiya|split/.test(t))
            return `Here is a smart way to split your **AED 300** Eidiya:
- **Save** 50%: AED 150 for your bicycle
- **Spend** 30%: AED 90 for something fun
- **Give** 20%: AED 60 as Sadaqa to help others
That way you enjoy it now and later.`;
          if (/sadaqa|charity|give/.test(t))
            return `**Sadaqa** means giving something to help others, like money, food or a kind act.
- Even a small amount counts
- It makes both you and the person feel happy
Would you like an idea for how to give this week?`;
          return `Try the **Three Jars Challenge** this week!
- Put a little money in Save, Spend and Give every day
- On Friday, count each jar
- See which one grew the most
You can do it!`;
        }
        const f = ctx("adult"),
          m = f.thisMonth,
          aed = HayatiData.aed;
        if (/overspend|over budget|spent|spending|this month|categor/.test(t)) {
          const top = [...m.byCategory].sort((a, b) => b.spent - a.spent)[0];
          return `This month the family has spent **${aed(m.spent)}** of a **${aed(m.limit)}** budget.
${m.overLimit.length ? `- Over the limit: **${m.overLimit.join(", ")}**` : "- No category is over its limit yet"}
- Biggest category: **${top.category}** at ${aed(top.spent)} of ${aed(top.limit)}
- Last month you spent ${aed(f.lastMonthSpent)} in total
Would you like ideas to trim ${m.overLimit[0] || top.category} next month?`;
        }
        if (/goal|hajj|car|emergency|saving/.test(t))
          return `Your savings goals:
${f.savingsGoals.map((g) => `- **${g.name}:** ${aed(g.saved)} of ${aed(g.target)} (${Math.round((g.saved / g.target) * 100)}%)`).join("\n")}
You have put aside **${aed(m.savedTowardGoals)}** this month. Want a monthly plan to finish one of these sooner?`;
        if (/eid|adha|fitr|ramadan/.test(t))
          return `For **Eid Al Adha (tentative, mid-May 2027)** your planned budget is **AED 5,400** and **AED 1,200** is saved, so **AED 4,200** is still needed.
- Saving about **AED 600 a month** gets you there with a small buffer
- Ramadan and Eid Al Fitr come earlier: together they need **AED 6,700** more
- Start with Eid Al Fitr, since it arrives first
Would you like a month-by-month plan?`;
        if (/summer|travel|trip|holiday/.test(t))
          return `Last summer's travel budget was **AED 12,000** and it was fully funded. To repeat that next year:
- Save about **AED 1,000 a month** from September
- Book flights in the early-booking window to cut costs
- Keep around 10% as a buffer for activities
This is a rough guide based on last year's numbers.`;
        if (/school|term|uniform/.test(t))
          return `Last year's back-to-school budget was **AED 3,800**, fully funded.
- Plan the same again for August
- Setting aside about **AED 320 a month** spreads it out evenly
- Parent-teacher meetings are free, so no extra cost there`;
        if (/weekend|plan|idea|cheap/.test(t))
          return `A low-cost weekend idea:
- **Saturday:** a picnic and walk at a local park, about AED 80 for food
- **Sunday:** a family movie night at home with Jiddo Khalid's stories
Roughly **AED 150** in total. Want a plan with more outings?`;
        return `Here is where the family stands:
- Next occasion: **Salem's birthday** on 29 October, fully funded
- Biggest upcoming cost: **Eid Al Adha** at AED 5,400, 22% saved
- National Day is on 2 December and is 40% funded
Ask me about any of these and I will make a plan.`;
      }

      async function ask(prompt) {
        const body = {
          prompt,
          history: convo,
          role,
          system: SYSTEM[role],
          context: ctx(role),
        };
        const res = await fetch(AI_ENDPOINT, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(body),
        });
        const d = await res.json();
        if (!res.ok) throw new Error(d.error ?? "HTTP " + res.status);
        const out =
          d.reply ??
          d.text ??
          d.candidates?.[0]?.content?.parts?.map((p) => p.text).join("");
        if (!out) throw new Error("Empty reply");
        return out;
      }

      const md = (t) => {
        t = esc(t).replace(/\*\*(.+?)\*\*/g, "<b>$1</b>");
        let h = "",
          ul = false;
        for (const l of t.split("\n")) {
          if (/^\s*[-*] /.test(l)) {
            if (!ul) {
              h += "<ul>";
              ul = true;
            }
            h += '<li dir="auto">' + l.replace(/^\s*[-*] /, "") + "</li>";
          } else {
            if (ul) {
              h += "</ul>";
              ul = false;
            }
            if (l.trim()) h += '<p dir="auto">' + l + "</p>";
          }
        }
        return h + (ul ? "</ul>" : "");
      };
      const reduce = matchMedia("(prefers-reduced-motion:reduce)").matches;
      const toEnd = () =>
        scrollTo({ top: document.body.scrollHeight, behavior: "smooth" });
      function typeOut(el, text) {
        return new Promise((res) => {
          if (reduce) {
            el.innerHTML = md(text);
            return res();
          }
          const w = text.split(/(\s+)/);
          let i = 0,
            cur = "";
          const id = setInterval(() => {
            cur += w[i++] || "";
            el.innerHTML = md(cur);
            toEnd();
            if (i >= w.length) {
              clearInterval(id);
              res();
            }
          }, 22);
        });
      }

      async function send(text) {
        text = text.trim();
        if (!text || busy) return;
        busy = true;
        $("#go").disabled = true;
        const my = sess;
        setChat(true);
        glow(true);
        stopSpeak();
        const th = $("#thread");
        th.insertAdjacentHTML(
          "beforeend",
          `<div class="msg u" dir="auto">${esc(text)}</div>`,
        );
        th.insertAdjacentHTML(
          "beforeend",
          `<div class="msg a"><div class="av"></div><div class="bub sk"><i></i><i></i><i></i></div></div>`,
        );
        const bub = th.lastElementChild.querySelector(".bub");
        $("#q").value = "";
        grow();
        toEnd();
        convo.push({ r: "user", t: text });
        persist();
        try {
          const r = await ask(text);
          if (my !== sess) return;
          bub.classList.remove("sk");
          bub.innerHTML = "";
          await typeOut(bub, r);
          convo.push({ r: "model", t: r });
          persist();
          if (speakOn) speak(r);
        } catch (e) {
          if (my !== sess) return;
          // No Gemini key or no internet: answer from the family's own data instead of failing.
          console.warn("Hayati AI unavailable, using built-in answer:", e.message);
          const r =
            demo(text) +
            "\n\n(Built-in answer from your family data. Connect Gemini for full answers.)";
          bub.classList.remove("sk");
          bub.innerHTML = "";
          await typeOut(bub, r);
          convo.push({ r: "model", t: r });
          persist();
        }
        busy = false;
        glow(false);
        $("#go").disabled = !$("#q").value.trim();
        $("#q").focus({ preventScroll: true });
      }
      function grow() {
        const q = $("#q");
        q.style.height = "";
        if (q.scrollHeight > q.clientHeight + 2)
          q.style.height = Math.min(220, q.scrollHeight) + "px";
      }
      function setRole(r, reset) {
        role = r;
        document
          .querySelectorAll(".seg button")
          .forEach((b) => b.setAttribute("aria-pressed", b.dataset.r === r));
        try {
          window.history.replaceState(null, "", "?role=" + r);
        } catch (e) {}
        $("#sub").textContent = SUB[r];
        $("#q").placeholder = PH[r];
        $("#chips").innerHTML = CH[r]
          .map(
            (c, i) =>
              `<button type="button" class="chip" data-i="${i}">${c[0]}</button>`,
          )
          .join("");
        if (reset) {
          sess++;
          curId = null;
          convo = [];
          $("#thread").innerHTML = "";
          setChat(false);
          grow();
          busy = false;
          glow(false);
          stopSpeak();
          if (listening) rec.stop();
          $("#go").disabled = !$("#q").value.trim();
        }

        setFine();
        renderList();
      }
      document.querySelectorAll(".seg button").forEach(
        (b) =>
          (b.onclick = () => {
            if (b.dataset.r !== role) setRole(b.dataset.r, true);
          }),
      );
      $("#chips").onclick = (e) => {
        const b = e.target.closest(".chip");
        if (!b) return;
        send(CH[role][+b.dataset.i][1]);
      };
      $("#pf").onsubmit = (e) => {
        e.preventDefault();
        send($("#q").value);
      };
      $("#q").addEventListener("input", () => {
        grow();
        $("#go").disabled = busy || !$("#q").value.trim();
      });
      $("#q").addEventListener("keydown", (e) => {
        if (e.key === "Enter" && !e.shiftKey && !e.isComposing) {
          e.preventDefault();
          $("#pf").requestSubmit();
        }
      });
      addEventListener(
        "scroll",
        () => $("#nav").classList.toggle("s", scrollY > 20),
        { passive: true },
      );

      const KEY = "hayati-ai-chats",
        save = () => {
          try {
            localStorage.setItem(KEY, JSON.stringify(chats));
          } catch (e) {}
        };
      let chats = null,
        curId = null,
        sess = 0;
      try {
        chats = JSON.parse(localStorage.getItem(KEY) || "null");
      } catch (e) {}
      if (!Array.isArray(chats)) {
        const mk = (r, title, q, ago) => {
          const o = role;
          role = r;
          const a = demo(q);
          role = o;
          return {
            id: "s" + Math.random().toString(36).slice(2, 8),
            role: r,
            title,
            t: Date.now() - ago * 864e5,
            msgs: [
              { r: "user", t: q },
              { r: "model", t: a },
            ],
          };
        };
        chats = [
          mk(
            "adult",
            "Eid Al Adha budget plan",
            "Help me plan the budget for Eid Al Adha next year.",
            0,
          ),
          mk(
            "adult",
            "Summer travel savings",
            "How much should we save each month for summer travel?",
            1,
          ),
          mk(
            "adult",
            "School term costs",
            "Forecast our school term costs for the next year.",
            3,
          ),
          mk(
            "adult",
            "Low-cost weekend plan",
            "Suggest a low-cost family weekend plan for next month.",
            3,
          ),
          mk("child", "My bicycle goal", "How close am I to my bicycle?", 0),
          mk(
            "child",
            "Splitting my Eidiya",
            "How should I split my Eidiya?",
            2,
          ),
        ];
        save();
      }
      const olderSamples = [
        {
          id: "sample-older-ramadan",
          role: "adult",
          title: "Ramadan spending plan",
          days: 21,
          question: "How should we plan our Ramadan spending?",
          answer:
            "Set a comfortable family limit before Ramadan begins, then divide it between groceries, iftar gatherings, and giving. A small weekly amount makes the month easier to manage.",
        },
        {
          id: "sample-older-hatta",
          role: "adult",
          title: "Family weekend in Hatta",
          days: 35,
          question: "Can you suggest a family weekend in Hatta?",
          answer:
            "Plan one main activity each day, pack snacks and water, and set a clear amount for meals and entry fees. Keeping the itinerary light leaves room to enjoy the trip together.",
        },
        {
          id: "sample-older-school",
          role: "adult",
          title: "Back-to-school budget",
          days: 49,
          question: "Help me prepare for back-to-school costs.",
          answer:
            "Start with uniforms, supplies, transport, and any school fees. Compare each estimate with last term, then spread the total across the months before school starts.",
        },
      ].map((c) => ({
        id: c.id,
        role: c.role,
        title: c.title,
        t: Date.now() - c.days * 864e5,
        msgs: [
          { r: "user", t: c.question },
          { r: "model", t: c.answer },
        ],
      }));
      let historyChanged = false;
      const seededWeekend = chats.find(
        (c) =>
          c.id.startsWith("s") &&
          c.role === "adult" &&
          c.title === "Low-cost weekend plan",
      );
      if (seededWeekend && seededWeekend.t < Date.now() - 7 * 864e5) {
        seededWeekend.t = Date.now() - 3 * 864e5;
        historyChanged = true;
      }
      olderSamples.forEach((sample) => {
        if (!chats.some((c) => c.id === sample.id)) {
          chats.push(sample);
          historyChanged = true;
        }
      });
      if (historyChanged) save();
      const uH = (t) => `<div class="msg u" dir="auto">${esc(t)}</div>`,
        aH = (t) =>
          `<div class="msg a"><div class="av"></div><div class="bub">${md(t)}</div></div>`;
      function persist() {
        if (!convo.length) return;
        let c = chats.find((x) => x.id === curId);
        if (!c) {
          c = {
            id: "c" + Date.now(),
            role,
            title: convo[0].t.replace(/\s+/g, " ").slice(0, 42),
            t: Date.now(),
            msgs: [],
          };
          chats.unshift(c);
          curId = c.id;
        }
        c.msgs = convo.slice();
        c.t = Date.now();
        save();
        renderList();
      }
      function renderList() {
        const q = $("#cs").value.trim().toLowerCase(),
          d0 = new Date().setHours(0, 0, 0, 0),
          G = {};
        chats
          .filter((c) => c.role === role && c.title.toLowerCase().includes(q))
          .sort((a, b) => b.t - a.t)
          .forEach((c) => {
            const n = c.t >= d0 ? 0 : Math.ceil((d0 - c.t) / 864e5),
              k =
                n === 0
                  ? "Today"
                  : n === 1
                    ? "Yesterday"
                    : n <= 7
                      ? "Previous 7 days"
                      : "Older";
            (G[k] = G[k] || []).push(c);
          });
        const h = ["Today", "Yesterday", "Previous 7 days", "Older"]
          .filter((k) => G[k])
          .map(
            (k) =>
              `<div class="gh">${k}</div>` +
              G[k]
                .map(
                  (c) =>
                    `<div class="ci${c.id === curId ? " on" : ""}">
                      <button class="ct" type="button" data-id="${c.id}"${c.id === curId ? ' aria-current="true"' : ""}>${esc(c.title)}</button>
                      <button class="cx" type="button" data-del="${c.id}" aria-label="Delete chat">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
                          <path d="M6 6l12 12M18 6 6 18" />
                        </svg>
                      </button>
                    </div>`,
                )
                .join(""),
          )
          .join("");
        $("#clist").innerHTML =
          h ||
          `<p class="emp">${q ? "No chats match your search." : "No chats yet. Ask Hayati something to start."}</p>`;
      }
      function setChat(on) {
        $("#ai").classList.toggle("chat", on);
        document.body.classList.toggle("chat", on);
      }
      function snap(on) {
        const a = $("#ai");
        a.classList.add("snap");
        setChat(on);
        requestAnimationFrame(() =>
          requestAnimationFrame(() => a.classList.remove("snap")),
        );
      }
      const wait = () => {
        if (busy) {
          note("Please wait for the reply to finish.");
          return true;
        }
      };
      function newChat() {
        if (wait()) return;
        sess++;
        curId = null;
        convo = [];
        $("#thread").innerHTML = "";
        snap(false);
        $("#q").value = "";
        grow();
        stopSpeak();
        glow(false);
        renderList();
        $("#sb").classList.remove("open");
        scrollTo({ top: 0 });
      }
      function openChat(id) {
        if (wait()) return;
        const c = chats.find((x) => x.id === id);
        if (!c) return;
        sess++;
        curId = id;
        convo = c.msgs.slice();
        stopSpeak();
        glow(false);
        $("#thread").innerHTML = convo
          .map((m) => (m.r === "user" ? uH(m.t) : aH(m.t)))
          .join("");
        snap(true);
        $("#q").value = "";
        grow();
        renderList();
        $("#sb").classList.remove("open");
        scrollTo({ top: document.body.scrollHeight });
      }
      function delChat(id) {
        if (busy && id === curId) {
          wait();
          return;
        }
        chats = chats.filter((c) => c.id !== id);
        save();
        if (id === curId) newChat();
        else renderList();
      }
      $("#newchat").onclick = newChat;
      $("#cs").oninput = renderList;
      $("#clist").onclick = (e) => {
        const o = e.target.closest(".ct"),
          x = e.target.closest(".cx");
        if (o) openChat(o.dataset.id);
        else if (x) delChat(x.dataset.del);
      };
      $("#sbt").onclick = () => $("#sb").classList.toggle("open");
      $("#scrim").onclick = () => $("#sb").classList.remove("open");

      function glow(on) {
        const b = $("#bw");
        b.classList.toggle("busy", on);
        if (on) {
          b.classList.remove("pulse");
          void b.offsetWidth;
          b.classList.add("pulse");
        }
      }
      function setFine() {
        $("#fine").textContent =
          (AI_ENDPOINT
            ? "Hayati AI can make mistakes. Please double-check important money decisions."
            : "Demo mode with sample answers. Add your Gemini link in the code to go live.") +
          " Enter to send.";
      }
      function note(t) {
        $("#fine").textContent = t;
        clearTimeout(note.t);
        note.t = setTimeout(setFine, 4500);
      }

      const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
      let rec = null,
        listening = false,
        vlang = "en-US",
        speakOn = false,
        heard = false;
      $("#lang").onclick = () => {
        vlang = vlang === "en-US" ? "ar-AE" : "en-US";
        const ar = vlang === "ar-AE";
        $("#lang").textContent = ar ? "AR" : "EN";
        $("#lang").setAttribute(
          "aria-label",
          "Voice language: " + (ar ? "Arabic" : "English"),
        );
        note(ar ? "Voice input is now Arabic." : "Voice input is now English.");
        if (listening) rec.stop();
      };
      function setListening(on) {
        listening = on;
        $("#mic").classList.toggle("on", on);
        $("#mic").setAttribute("aria-pressed", on);
        $("#bw").classList.toggle("listening", on);
        $("#q").placeholder = on
          ? vlang === "ar-AE"
            ? "أستمع إليك…"
            : "Listening…"
          : PH[role];
      }
      $("#mic").onclick = () => {
        if (!SR) {
          note(
            "Voice input is not supported in this browser. Try Chrome, Edge or Safari.",
          );
          return;
        }
        if (listening) {
          rec.stop();
          return;
        }
        if (busy) return;
        stopSpeak();
        rec = new SR();
        rec.lang = vlang;
        rec.interimResults = true;
        rec.continuous = false;
        heard = false;
        const base = $("#q").value.trim();
        rec.onresult = (e) => {
          let t = "";
          for (const r of e.results) {
            t += r[0].transcript;
            if (r.isFinal) heard = true;
          }
          $("#q").value = (base ? base + " " : "") + t;
          grow();
          $("#go").disabled = busy || !$("#q").value.trim();
        };
        rec.onend = () => {
          setListening(false);
          if (heard && $("#q").value.trim() && !busy) send($("#q").value);
        };
        rec.onerror = (e) => {
          heard = false;
          setListening(false);
          if (e.error === "not-allowed" || e.error === "service-not-allowed")
            note(
              "Microphone access is blocked. Allow it in your browser settings.",
            );
          else if (e.error === "no-speech")
            note("I did not hear anything. Tap the mic and try again.");
          else if (e.error !== "aborted")
            note("Voice input had a problem. Please try again.");
        };
        try {
          rec.start();
          setListening(true);
        } catch (e) {
          setListening(false);
        }
      };
      const TTS = window.speechSynthesis;
      if (!TTS) $("#spk").style.display = "none";
      function stopSpeak() {
        if (TTS) TTS.cancel();
      }
      function speak(t) {
        if (!TTS) return;
        TTS.cancel();
        const u = new SpeechSynthesisUtterance(
          t.replace(/\*\*/g, "").replace(/^\s*[-*] /gm, ""),
        );
        u.lang = /[\u0600-\u06FF]/.test(t) ? "ar-AE" : "en-US";
        TTS.speak(u);
      }
      $("#spk").onclick = () => {
        speakOn = !speakOn;
        $("#spk").setAttribute("aria-pressed", speakOn);
        if (!speakOn) stopSpeak();
        note(speakOn ? "Replies will be read aloud." : "Read aloud is off.");
      };

      setRole(role, false);
    </script>
  </body>
</html>
